backlogs:
  default-theme-catppuccin-mocha:
    status: done
    description: |
      Make `catppuccin-mocha` the actual default theme under the current Textual API.
    plan: |
      Update the app to use the supported theme configuration for the installed Textual version.
      Verify the app starts with the mocha theme enabled by default.

  cli-help-and-file-input:
    status: done
    description: |
      Add a proper CLI so `visibill --help` works and `visibill -f some-log-file.log`
      can open log files directly.
    plan: |
      Add argument parsing in the entrypoint for `--help`, `-f/--file`, and stdin fallback.
      Keep the current pipe-based workflow working as-is.
      Add tests for help output and file input handling.

  ripgrep-file-backed-search:
    status: pending
    description: |
      Use `rg` for plain-text search when the session is backed by a file, while keeping
      in-memory filtering for piped stdin sessions.
    plan: |
      Detect file-backed sessions in the CLI or app startup path.
      Route plain-text search through `ripgrep` for file sources only.
      Preserve the existing in-memory search path for stdin input.
      Add coverage for the file-backed and stdin-backed modes.

  quoted-filter-values:
    status: done
    description: |
      Support quoted filter values with spaces, for example `message~"document expiration"`,
      instead of splitting every clause on whitespace.
    plan: |
      Tokenize structured filters with quote-aware parsing so values can contain spaces.
      Preserve existing unquoted clause behavior and raise a clear parse error for unmatched quotes.
      Add parser, matcher, and README coverage for quoted filter examples.

  filter-input-debounce:
    status: done
    description: |
      Make filter input debounce more robust so rapid typing never applies stale values
      or misses the latest edit.
    plan: |
      Harden the debounce callback so stale timers cannot apply older input after newer edits.
      Keep the current short delay, but ensure only the latest pending filter value wins.
      Add or update tests for rapid successive changes and final-value application.
