archived:
  numeric-field-comparisons:
    status: cancelled
    description: |
      Add structured comparison support for explicit numeric fields if real log data
      needs it beyond `timestamp`.
    plan: ""
    reason: |
      No real-world use case identified. Timestamp comparisons already work. Archived
      until explicit numeric field filtering is requested.

  timestamp-parsing-expansion:
